<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <title>Kmetija Tavanovo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <noscript><meta http-equiv="refresh" content="0; url=sl/"></noscript>
  <script>
    (function () {
      var l = (navigator.language || 'sl').toLowerCase();
      var to = l.indexOf('sl') === 0 ? 'sl/' : l.indexOf('it') === 0 ? 'it/' : 'en/';
      location.replace(to);
    })();
  </script>
</head>
<body>
  <p><a href="sl/">Slovenščina</a> · <a href="it/">Italiano</a> · <a href="en/">English</a></p>
</body>
</html>
